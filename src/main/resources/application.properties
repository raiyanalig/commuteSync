spring.application.name=commutesync
server.port=8080

# PostgreSQL (defaults match docker-compose.yml)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:commutesync}
spring.datasource.username=${DB_USER:commutesync}
spring.datasource.password=${DB_PASSWORD:commutesync}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
app.jwt.secret=${JWT_SECRET:commutesync-default-dev-secret-key-change-in-production-please-1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
