# Production overrides. Activate with SPRING_PROFILES_ACTIVE=prod.
# The base application.properties already reads DB_* / JWT_* from the environment.

# Flyway owns the schema; Hibernate only validates it.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Secrets must come from the environment in production (fail fast if missing).
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Connection pool sized for a single instance; tune per deployment.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# Behind a reverse proxy / load balancer.
server.forward-headers-strategy=framework

# Never leak internals to clients.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Logging
logging.level.com.commutesync=INFO
logging.level.org.hibernate.SQL=WARN
